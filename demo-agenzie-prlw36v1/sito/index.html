<head>

<meta name="robots" content="noindex,nofollow">

<title>HubAgency · Il tuo sito · anteprima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:wght@500;600&family=DM+Serif+Display&family=Lora:wght@500;600&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600&family=Space+Grotesk:wght@400;600&family=Raleway:wght@400;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f5f5;color:#171717}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
/* ===== app HubAgency ===== */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:10px 20px;background:#fff;border-bottom:1px solid #e5e5e5}
.top img{height:28px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;color:#525252;font-weight:500}
.tab.on{background:#171717;color:#fff}
.top .sp{flex:1}
.btn{border:1px solid #e5e5e5;background:#fff;border-radius:8px;padding:8px 14px;font-weight:500}
.btn.red{background:#c1121f;border-color:#c1121f;color:#fff}
.btn.dark{background:#171717;border-color:#171717;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.wrap{padding:24px 28px}
h1.pg{font-size:22px;margin:0 0 4px}
.sub{color:#737373;margin:0 0 20px}
.filters{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.chip{border:1px solid #e5e5e5;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:#171717;color:#fff;border-color:#171717}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;transition:.15s}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-2px)}
.card.sel{outline:3px solid #c1121f}
.thumb{position:relative;height:220px;overflow-y:auto;overflow-x:hidden;background:#eee;border-bottom:1px solid #eee;cursor:zoom-in;scrollbar-width:thin}
.thumb .sc{position:relative;overflow:clip}
.thumb .sc>div{position:absolute;top:0;left:0;width:1280px;transform-origin:top left;pointer-events:none}
.thumb .zoom{position:sticky;top:8px;display:block;width:max-content;margin:0 8px -24px auto;z-index:2;background:rgba(23,23,23,.8);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;opacity:0;transition:.15s}
.thumb:hover .zoom{opacity:1}
.big{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.6);display:flex;flex-direction:column}
.big .bh{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-bottom:1px solid #e5e5e5}
.big .bb{flex:1;overflow:auto;display:flex;justify-content:center;padding:20px}
.big .bb>div{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3);height:max-content;transition:width .25s}
.card .meta{display:flex;align-items:center;gap:10px;padding:12px 14px}
.card .meta b{font-size:15px}
.card .meta small{color:#737373;display:block}
.card .meta .sp{flex:1}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.1)}
/* editor */
.ed{display:grid;grid-template-columns:300px 1fr;grid-template-rows:100%;height:calc(100vh - 53px);overflow:hidden}
.ed>*{min-height:0}
.side{background:#fff;border-right:1px solid #e5e5e5;overflow:auto;padding:16px}
.side h4{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#737373}
.side h4:first-child{margin-top:0}
.side label{display:block;font-size:12px;color:#525252;margin:8px 0 3px}
.side input[type=text]{width:100%;border:1px solid #e5e5e5;border-radius:8px;padding:7px 9px;font-size:13px}
.secrow{display:flex;align-items:center;gap:6px;padding:7px 8px;border:1px solid #eee;border-radius:8px;margin-bottom:5px;font-size:13px;background:#fafafa}
.secrow.off{opacity:.45}
.secrow span{flex:1}
.ib{border:0;background:none;padding:2px 5px;border-radius:5px;color:#525252}
.ib:hover{background:#eee}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;outline:1px solid #ddd}
.sw button.on{outline:2px solid #171717}
.hint{font-size:12px;color:#737373;background:#fff7e6;border:1px solid #fde3b0;border-radius:8px;padding:8px 10px;line-height:1.45}
.stage{overflow:auto;background:#e9e9e9;padding:18px;display:flex;flex-direction:column;align-items:center}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;width:100%;max-width:1280px}
.bar .sp{flex:1}
.seg{display:inline-flex;background:#fff;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px}
.seg button.on{background:#171717;color:#fff}
.frame{background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.15);border-radius:10px;overflow:hidden;transition:width .25s;max-width:100%}
/* tabella annunci */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden}
.t th,.t td{padding:10px 12px;border-bottom:1px solid #f0f0f0;text-align:left;font-size:14px;vertical-align:middle}
.t th{font-size:12px;color:#737373;text-transform:uppercase;letter-spacing:.04em;background:#fafafa}
.t img{width:72px;height:50px;object-fit:cover;border-radius:6px}
.tg{position:relative;width:38px;height:22px;border-radius:99px;background:#d4d4d4;border:0;transition:.2s;vertical-align:middle}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:#16a34a}
.tg.on::after{left:19px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#f5f5f5;color:#525252;margin:2px}
.pill.g{background:#e9f8ef;color:#15803d}
/* modali */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.mod h3{margin:0 0 6px}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.lib img{width:100%;height:90px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.lib img:hover{border-color:#c1121f}
.chan{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #eee;border-radius:10px;margin-bottom:8px}
.chan div{flex:1}
.chan small{color:#737373;display:block}
/* architettura */
.doc{max-width:980px}
.doc .box{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:18px 22px;margin-bottom:14px}
.doc h3{margin:0 0 8px;font-size:17px}
.doc p,.doc li{font-size:14px;line-height:1.6;color:#262626}
.doc code{background:#f5f5f5;padding:1px 5px;border-radius:4px;font-size:12.5px}
.doc pre{background:#171717;color:#e5e5e5;padding:14px;border-radius:10px;font-size:12.5px;overflow:auto;line-height:1.5}
.doc .warn{border-left:4px solid #c1121f}

/* ===== sito generato (stili guidati da variabili del template) ===== */
.site{container-type:inline-size;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6}
.site h1,.site h2,.site h3{font-family:var(--head);font-weight:var(--hw);margin:0;line-height:1.15;text-transform:var(--case);letter-spacing:var(--ls)}
.site h2{font-size:clamp(26px,3.4cqi,44px);margin-bottom:10px}
.site .in{max-width:1180px;margin:0 auto;padding:0 clamp(18px,4cqi,48px)}
.site section{padding:clamp(44px,7cqi,96px) 0}
.site .muted{color:var(--muted)}
.site .acc{color:var(--accent)}
.site .sbtn{display:inline-block;background:var(--accent);color:var(--atext);border:0;padding:13px 24px;border-radius:var(--r);font-weight:600;font-family:var(--body);text-decoration:none}
.site .sbtn.o{background:transparent;color:inherit;border:1.5px solid currentColor}
.site .hdr{display:flex;align-items:center;gap:24px;padding:18px 0}
.site .logo{font-family:var(--head);font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.site .logo img{height:38px}
.site .nav{display:flex;gap:26px;flex:1;justify-content:center;font-size:14px;font-weight:500}
.site .nav a{color:inherit;text-decoration:none;opacity:.85}
.site .g2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3cqi,40px)}
.site .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.4cqi,28px)}
.site .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.site .surf{background:var(--surf)}
.site .ph{width:100%;height:100%;object-fit:cover;display:block;border-radius:var(--r)}
.site .lc{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.2s;border:1px solid var(--line)}
.site .lc:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.12)}
.site .lc .im{position:relative;aspect-ratio:4/3;overflow:hidden}
.site .lc .im img{width:100%;height:100%;object-fit:cover}
.site .badge{position:absolute;top:12px;left:12px;background:var(--accent);color:var(--atext);font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--r)}
.site .price{font-family:var(--head);font-size:22px;font-weight:700;color:var(--accent)}
.site .feat{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.site .ovl{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.75));color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.site .lrow{display:grid;grid-template-columns:320px 1fr auto;gap:24px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer}
.site .lrow img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r)}
.site .hero-t{font-size:clamp(34px,5.6cqi,76px)}
.site .search{display:flex;background:#fff;border-radius:var(--r);padding:8px;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.12);margin-top:26px;max-width:620px}
.site .search select,.site .search input{flex:1;border:0;padding:10px;font-size:14px;background:#f6f6f6;border-radius:calc(var(--r)/1.5);color:#222;min-width:0}
.site .form input,.site .form textarea{width:100%;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r);margin-bottom:10px;font-family:var(--body)}
.site .ftr{padding:34px 0;font-size:13px;border-top:1px solid var(--line)}
.site .fchip{border:1px solid var(--line);background:transparent;color:inherit;padding:6px 14px;border-radius:99px;font-size:13px}
.site .fchip.on{background:var(--accent);color:var(--atext);border-color:var(--accent)}
@container (max-width:780px){
  .site .g2,.site .g3,.site .g4{grid-template-columns:1fr !important}
  .site .nav{display:none}
  .site .hdr{justify-content:space-between}
  .site .lrow{grid-template-columns:1fr}
  .site .hidem{display:none !important}
  .site .search{flex-direction:column}
}
@container (min-width:781px) and (max-width:1000px){
  .site .g3{grid-template-columns:1fr 1fr}
  .site .g4{grid-template-columns:1fr 1fr}
}
/* modalità modifica */
.editing [data-ed]{outline:1.5px dashed transparent;outline-offset:3px;border-radius:3px;cursor:text;transition:outline-color .15s}
.editing [data-ed]:hover{outline-color:#3b82f6}
.editing [data-ed]:focus{outline:2px solid #3b82f6;background:rgba(59,130,246,.06)}
.imgwrap{position:relative;height:100%}
.editing .imgwrap{cursor:pointer}
.imgtools{display:none;position:absolute;inset:0;background:rgba(23,23,23,.45);align-items:center;justify-content:center;gap:8px;border-radius:var(--r);z-index:3}
.editing .imgwrap:hover .imgtools{display:flex}
.imgtools button{background:#fff;color:#171717;border:0;border-radius:8px;padding:8px 12px;font:500 13px Inter,sans-serif}
.addimg{display:flex;align-items:center;justify-content:center;height:100%;min-height:160px;border:2px dashed #93c5fd;border-radius:var(--r);color:#3b82f6;font:500 14px Inter,sans-serif;background:rgba(59,130,246,.05);cursor:pointer}
.secwrap{position:relative}
.editing .secwrap:hover{box-shadow:inset 0 0 0 2px #3b82f6}
.sectag{display:none;position:absolute;top:8px;right:8px;z-index:5;background:#3b82f6;color:#fff;font:600 11px Inter,sans-serif;padding:4px 8px;border-radius:6px;gap:4px;align-items:center}
.editing .secwrap:hover .sectag{display:flex}
.sectag button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:4px;padding:1px 6px;font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:10px 18px;border-radius:10px;z-index:200;font-size:14px}
</style>
</head>

function Photo({src,style,className,alt=''}){
  return <img src={src||FALLBACK} alt={alt} className={className} style={style} loading="lazy" onError={e=>{if(e.currentTarget.src!==FALLBACK)e.currentTarget.src=FALLBACK}}/>;

/* testo modificabile: in modifica è contentEditable, salva all'uscita */
function T({p,as='span',className,style}){
  const {edit,get,set}=useEd(); const ref=useRef(null); const v=get(p);
  useLayoutEffect(()=>{ if(edit && ref.current && document.activeElement!==ref.current) ref.current.innerText=v??''; },[v,edit]);
  const Tag=as;
  if(!edit) return <Tag className={className} style={style}>{v}</Tag>;
  return <Tag ref={ref} data-ed="" className={className} style={style} contentEditable suppressContentEditableWarning spellCheck={false}
    onClick={e=>e.stopPropagation()}
    onKeyDown={e=>{ if(e.key==='Enter' && as!=='p'){e.preventDefault();e.currentTarget.blur();} }}
    onBlur={e=>{ const nv=e.currentTarget.innerText.trim(); if(nv!==v) set(p,nv); }}/>;
}
/* foto modificabile: cambia o togli */
function I({p,style,className,ratio}){
  const {edit,get,set,pick}=useEd(); const v=get(p);
  const box={height:'100%',...(ratio?{aspectRatio:ratio,height:'auto'}:{})};
  if(!v){ return edit ? <div className="addimg" style={box} onClick={e=>{e.stopPropagation();pick(u=>set(p,u))}}>+ Aggiungi foto</div> : null; }
  return <div className="imgwrap" style={box}>
    <Photo src={v} className={className||'ph'} style={style}/>
    {edit && <div className="imgtools" onClick={e=>e.stopPropagation()}>
      <button onClick={()=>pick(u=>set(p,u))}>Cambia foto</button>
      <button onClick={()=>set(p,null)}>Togli</button>
    </div>}
  </div>;
}

  return <div className="wrap">
    <h1 className="pg">Scegli il modello del tuo sito</h1><p className="sub">30 modelli pronti. Cambi modello quando vuoi: testi, foto e annunci restano.</p>
    <div className="filters">{['tutti',...Object.keys(FAM)].map(k=><button key={k} className={'chip'+(fam===k?' on':'')} onClick={()=>setFam(k)}>{k==='tutti'?'Tutti (30)':FAM[k].label+' (5)'}</button>)}</div>
    <div className="gal">{list.map(t=><Thumb key={t.id} t={t} sel={cur===t.id} onPick={onPick} onZoom={setZoom} listings={listings}/>)}</div>
    {zoom && <BigPreview t={zoom} listings={listings} sel={cur===zoom.id} onClose={()=>setZoom(null)} onPick={t=>{setZoom(null);onPick(t)}}/>}
  </div>;
}
function BigPreview({t,listings,sel,onClose,onPick}){
  const [vp,setVp]=useState('desktop'); const demo=useMemo(()=>newSite(t),[t]); const [open,setOpen]=useState(null);
  useEffect(()=>{ const k=e=>{ if(e.key==='Escape') onClose(); }; addEventListener('keydown',k); return ()=>removeEventListener('keydown',k); },[]);
  return <div className="big">
    <div className="bh"><b>{t.name}</b><span style={{color:'#737373'}}>· {FAM[t.fam].label}</span><span style={{flex:1}}/>
      <div className="seg">{[['desktop','Computer'],['tablet','Tablet'],['mobile','Telefono']].map(([k,l])=><button key={k} className={vp===k?'on':''} onClick={()=>setVp(k)}>{l}</button>)}</div>
      <button className={'btn'+(sel?' dark':' red')} onClick={()=>onPick(t)}>{sel?'In uso · Modifica':'Usa questo modello'}</button>
      <button className="btn" onClick={onClose}>Chiudi ✕</button></div>
    <div className="bb" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}><div style={{width:{desktop:'min(1280px,100%)',tablet:820,mobile:390}[vp]}}><Site site={demo} listings={listings} onOpen={setOpen}/></div></div>
    {open && <Detail l={open} onClose={()=>setOpen(null)}/>}
  </div>;
}
function Thumb({t,sel,onPick,onZoom,listings}){
  const ref=useRef(null); const inner=useRef(null); const [sc,setSc]=useState(.23); const [h,setH]=useState(900); const [vis,setVis]=useState(false);
  useEffect(()=>{ if(!vis||!inner.current) return; const ro=new ResizeObserver(()=>setH(inner.current.offsetHeight)); ro.observe(inner.current); return ()=>ro.disconnect(); },[vis]);
  useEffect(()=>{ const el=ref.current; const ro=new ResizeObserver(()=>setSc(el.clientWidth/1280)); ro.observe(el);
    const io=new IntersectionObserver(([e])=>{ if(e.isIntersecting){setVis(true);io.disconnect();} },{rootMargin:'300px'}); io.observe(el);
    return ()=>{ro.disconnect();io.disconnect()}; },[]);
  const demo=useMemo(()=>newSite(t),[t]);
  return <div className={'card'+(sel?' sel':'')}>
    <div className="thumb" ref={ref} onClick={()=>onZoom(t)} title="Scorri con la rotella, clicca per vederlo grande"><span className="zoom">🔍 Clicca per ingrandire</span>
      {vis && <div className="sc" style={{height:h*sc}}><div ref={inner} style={{transform:`scale(${sc})`}}><Site site={demo} listings={listings}/></div></div>}</div>
    <div className="meta"><div><b>{t.name}</b><small>{FAM[t.fam].label}</small></div><span className="sp"/>
      <span className="dot" style={{background:t.bg}}/><span className="dot" style={{background:t.accent}}/>
      <button className={'btn'+(sel?' dark':' red')} onClick={()=>onPick(t)}>{sel?'In uso · Modifica':'Usa questo'}</button></div>
  </div>;
}

function Picker({onClose,onPick}){
  return <div className="ov" onClick={onClose}><div className="mod" onClick={e=>e.stopPropagation()}>
    <h3>Scegli una foto</h3><p className="sub" style={{margin:0}}>Dalle foto dei tuoi immobili o dal tuo computer.</p>
    <div className="lib">{LIB.map(u=><img key={u} src={u.replace('w=1400','w=300')} onClick={()=>onPick(u)}/>)}</div>
    <label className="btn" style={{display:'inline-block'}}>Carica dal computer…<input type="file" accept="image/*" hidden onChange={e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>onPick(r.result); r.readAsDataURL(f);}}/></label>
    <button className="btn" style={{marginLeft:8}} onClick={onClose}>Annulla</button>
  </div></div>;
}
function Detail({l,onClose}){
  return <div className="ov" onClick={onClose}><div className="mod" style={{maxWidth:860}} onClick={e=>e.stopPropagation()}>
    <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:8,height:340}}><Photo src={l.photos[0]} className="ph" style={{borderRadius:10}}/><div style={{display:'grid',gap:8}}>{l.photos.slice(1,3).map(p=><Photo key={p} src={p} className="ph" style={{borderRadius:10}}/>)}</div></div>
    <div style={{display:'flex',alignItems:'baseline',gap:14,marginTop:16}}><h3 style={{fontSize:24,flex:1}}>{l.title}</h3><b style={{fontSize:22,color:'#c1121f'}}>{eur(l)}</b></div>
    <p className="sub" style={{margin:'4px 0 10px'}}>{l.type} · {l.zone} · {l.mq} m² · {l.loc} locali · {l.bagni} bagni · Classe {l.cls}</p>
    <p style={{fontSize:14,lineHeight:1.6}}>Pagina dell’annuncio sul sito dell’agenzia: stessi dati e foto della scheda in HubAgency, con modulo di contatto che crea il contatto nel CRM e indirizzo proprio indicizzabile su Google.</p>
    <button className="btn dark" onClick={onClose}>Chiudi</button></div></div>;
}

function Editor({site,setSite,undo,canUndo,listings,goGallery,toast,publish}){
  const [vp,setVp]=useState('desktop'); const [edit,setEdit]=useState(true); const [pk,setPk]=useState(null); const [open,setOpen]=useState(null);
  const t=TEMPLATES.find(x=>x.id===site.templateId); const W={desktop:1280,tablet:820,mobile:390}[vp];
  const move=(type,dir)=>setSite(s=>{ const a=[...s.sections]; const i=a.findIndex(x=>x.type===type);
    if(dir===0){a[i]={...a[i],visible:!a[i].visible}; return {...s,sections:a};}
    const j=i+dir; if(j<0||j>=a.length) return s; [a[i],a[j]]=[a[j],a[i]]; return {...s,sections:a}; });
  const allTypes=Object.keys(SEC); const missing=allTypes.filter(k=>!site.sections.find(s=>s.type===k));
  const ag=(k,v)=>setSite(s=>({...s,agency:{...s.agency,[k]:v}}));
  return <div className="ed">
    <aside className="side">
      <h4>Modello</h4>
      <div style={{display:'flex',alignItems:'center',gap:8}}><b style={{flex:1}}>{t.name} <span style={{color:'#737373',fontWeight:400}}>· {FAM[t.fam].label}</span></b><button className="btn" onClick={goGallery}>Cambia</button></div>
      <h4>Dati agenzia</h4>
      {[['name','Nome'],['phone','Telefono'],['email','Email'],['address','Indirizzo']].map(([k,l])=><div key={k}><label>{l}</label><input type="text" value={site.agency[k]} onChange={e=>ag(k,e.target.value)}/></div>)}
      <label>Logo</label>
      <div style={{display:'flex',gap:6}}><label className="btn" style={{fontSize:13}}>Carica logo<input type="file" accept="image/*" hidden onChange={e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>ag('logo',r.result); r.readAsDataURL(f);}}/></label>{site.agency.logo&&<button className="btn" style={{fontSize:13}} onClick={()=>ag('logo',null)}>Togli</button>}</div>
      <h4>Colore principale</h4>
      <div className="sw"><button title="del modello" className={!site.accent?'on':''} style={{background:t.accent}} onClick={()=>setSite(s=>({...s,accent:null}))}/>{ACCENTS.map(c=><button key={c} className={site.accent===c?'on':''} style={{background:c}} onClick={()=>setSite(s=>({...s,accent:c}))}/>)}</div>
      <h4>Sezioni della pagina</h4>
      {site.sections.map((s,i)=><div key={s.type} className={'secrow'+(s.visible?'':' off')}><span>{SEC_LABEL[s.type]}</span>
        <button className="ib" title="su" onClick={()=>move(s.type,-1)} disabled={i===0}>↑</button><button className="ib" title="giù" onClick={()=>move(s.type,1)}>↓</button>
        <button className="ib" title="mostra/nascondi" onClick={()=>move(s.type,0)}>{s.visible?'👁':'⊘'}</button></div>)}
      {missing.length>0 && <select style={{width:'100%',marginTop:6,padding:7,borderRadius:8,border:'1px solid #e5e5e5'}} value="" onChange={e=>setSite(s=>({...s,sections:[...s.sections,{type:e.target.value,visible:true}]}))}>
        <option value="">+ Aggiungi sezione…</option>{missing.map(k=><option key={k} value={k}>{SEC_LABEL[k]}</option>)}</select>}
      <h4>Come si modifica</h4>
      <div className="hint">Clicca su un testo nella pagina e scrivi. Passa sopra una foto per cambiarla o toglierla. Le sezioni si spostano con le frecce. Niente trascinamenti liberi: il sito resta sempre in ordine anche sul telefono.</div>
    </aside>
    <div className="stage">
      <div className="bar">
        <div className="seg"><button className={edit?'on':''} onClick={()=>setEdit(true)}>Modifica</button><button className={!edit?'on':''} onClick={()=>setEdit(false)}>Anteprima</button></div>
        <div className="seg">{[['desktop','Computer'],['tablet','Tablet'],['mobile','Telefono']].map(([k,l])=><button key={k} className={vp===k?'on':''} onClick={()=>setVp(k)}>{l}</button>)}</div>
        <button className="btn" onClick={undo} disabled={!canUndo}>↶ Annulla</button>
        <span className="sp"/><span style={{fontSize:13,color:'#525252'}}>casabrera.hubagency.site</span>
        <button className="btn red" onClick={publish}>Pubblica sito</button>
      </div>
      <div className="frame" style={{width:W}}>
        <Site site={site} listings={listings} edit={edit} onChange={setSite} pick={cb=>setPk(()=>cb)} toast={toast} onOpen={setOpen} onMove={move}/>
      </div>
    </div>
    {pk && <Picker onClose={()=>setPk(null)} onPick={u=>{pk(u);setPk(null)}}/>}
    {open && <Detail l={open} onClose={()=>setOpen(null)}/>}
  </div>;
}

const CHANNELS=[['sito','Il tuo sito web','Pubblicazione immediata, nessun costo'],['immobiliare','Immobiliare.it','Richiede accreditamento come gestionale (in analisi)'],['idealista','Idealista','Tramite software accreditato (in analisi)'],['casa','Casa.it','Tracciato da verificare (in analisi)']];
function Annunci({listings,setListings,toast}){
  const [pub,setPub]=useState(null);
  const tog=(id,k)=>setListings(ls=>ls.map(l=>l.id===id?{...l,ch:{...l.ch,[k]:!l.ch[k]}}:l));
  return <div className="wrap">
    <h1 className="pg">Immobili</h1><p className="sub">L’interruttore «Sito web» mette o toglie l’annuncio dal tuo sito all’istante. Prova: spegnilo e torna nell’editor.</p>
    <table className="t"><thead><tr><th></th><th>Immobile</th><th>Prezzo</th><th>Dove è pubblicato</th><th>Sito web</th><th></th></tr></thead><tbody>
      {listings.map(l=><tr key={l.id}><td><img src={l.photos[0].replace('w=1400','w=200')}/></td><td><b>{l.title}</b><div style={{color:'#737373',fontSize:13}}>{l.type} · {l.zone} · {l.mq} m²</div></td><td>{eur(l)}</td>
        <td>{CHANNELS.filter(([k])=>l.ch[k]).map(([k,n])=><span key={k} className="pill g">{n}</span>)}{!Object.values(l.ch).some(Boolean)&&<span className="pill">Non pubblicato</span>}</td>
        <td><button className={'tg'+(l.ch.sito?' on':'')} onClick={()=>tog(l.id,'sito')}/></td>
        <td><button className="btn" onClick={()=>setPub(l.id)}>Pubblica annuncio…</button></td></tr>)}
    </tbody></table>
    {pub && (()=>{ const l=listings.find(x=>x.id===pub); return <div className="ov" onClick={()=>setPub(null)}><div className="mod" style={{maxWidth:520}} onClick={e=>e.stopPropagation()}>
      <h3>Pubblica annuncio</h3><p className="sub">{l.title} · {l.zone}</p>
      {CHANNELS.map(([k,n,d])=><div key={k} className="chan"><div><b>{n}</b><small>{d}</small></div><button className={'tg'+(l.ch[k]?' on':'')} onClick={()=>tog(l.id,k)}/></div>)}
      <div style={{display:'flex',gap:8,marginTop:10}}><button className="btn red" onClick={()=>{setPub(null);toast('Pubblicazione aggiornata (anteprima dimostrativa)')}}>Conferma</button><button className="btn" onClick={()=>setPub(null)}>Chiudi</button></div>
    </div></div>; })()}
  </div>;
}

function App(){
  const [tab,setTab]=useState(()=>location.hash.slice(1)||'modelli');
  const [site,setSiteRaw]=useState(()=>{ try{ return JSON.parse(localStorage.getItem('ha_site'))||newSite(TEMPLATES[0]); }catch{ return newSite(TEMPLATES[0]); } });
  const [hist,setHist]=useState([]);
  const [listings,setListings]=useState(()=>{ try{ return JSON.parse(localStorage.getItem('ha_list'))||LISTINGS0; }catch{ return LISTINGS0; } });
  const [msg,setMsg]=useState(null);
  const toast=m=>{setMsg(m);setTimeout(()=>setMsg(null),2600)};
  const setSite=f=>setSiteRaw(s=>{ const n=typeof f==='function'?f(s):f; if(n!==s) setHist(h=>[...h.slice(-40),s]); return n; });
  const undo=()=>setHist(h=>{ if(!h.length) return h; setSiteRaw(h.at(-1)); return h.slice(0,-1); });
  useEffect(()=>{ try{localStorage.setItem('ha_site',JSON.stringify(site))}catch{} },[site]);
  useEffect(()=>{ localStorage.setItem('ha_list',JSON.stringify(listings)) },[listings]);
  const pickTemplate=t=>{ if(t.id!==site.templateId){ setSite(s=>({...s,templateId:t.id,sections:FAM[t.fam].order.map(type=>({type,visible:true}))})); } setTab('editor'); };
  return <div>
    <div className="top"><img src="logo-hubagency.png" onError={e=>e.currentTarget.style.display='none'}/><b style={{fontSize:15}}>Il mio sito</b>
      <div className="tabs">{[['modelli','1 · Scegli modello'],['editor','2 · Modifica'],['annunci','3 · Annunci']].map(([k,l])=><button key={k} className={'tab'+(tab===k?' on':'')} onClick={()=>setTab(k)}>{l}</button>)}</div>
      <span className="sp"/><button className="btn" onClick={()=>{localStorage.clear();location.reload()}}>Ricomincia</button></div>
    {tab==='modelli' && <Gallery cur={site.templateId} onPick={pickTemplate} listings={listings}/>}
    {tab==='editor' && <Editor site={site} setSite={setSite} undo={undo} canUndo={hist.length>0} listings={listings} goGallery={()=>setTab('modelli')} toast={toast} publish={()=>toast('Sito pubblicato su casabrera.hubagency.site (anteprima dimostrativa)')}/>}
    {tab==='annunci' && <Annunci listings={listings} setListings={setListings} toast={toast}/>}
    
    {msg && <div className="toast">{msg}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
