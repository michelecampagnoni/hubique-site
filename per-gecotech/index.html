<script>window.PER = {"slug": "gecotech", "azienda": "Gecotech", "para": "Se i materiali che gestite sono molti, ci piacerebbe proporvi un tool che permette di leggere bolle e DDT da una foto e di confrontarli con le fatture dei fornitori, tenendo i materiali sotto controllo; se invece una squadra piccola segue grandi patrimoni, ogni ora e ogni materiale non registrato pesa sul risultato e al committente va comunque consegnata la documentazione, allora Vi servirebbero i rapportini di intervento dettati a voce dal tecnico, con foto e firma del cliente, senza ricopiare nulla in ufficio. Sono soluzioni che abbiamo già adottato con alcune aziende di gestione tecnica e manutenzione di grandi immobili, che hanno così avuto la documentazione sempre pronta, prodotta mentre il lavoro si faceva.", "bullets": ["Scadenzario dei controlli periodici e dei contratti di manutenzione — per non scoprire una scadenza a cose fatte: ogni cliente ha il suo avviso prima della data.", "Margine reale di ogni commessa, visibile mentre i lavori sono in corso — per quando si vuole correggere in tempo e non a bilancio chiuso."], "kits": ["RAP", "MARG"], "main": "RAP"};</script>
<script type="module">
const H = "56dccc899e0cec27fc4ec3f80f1d28f7c8404c51ca04f7eb69d3c6b4b4258855", S = "gecotech";
const gate = document.getElementById('gate'), inp = document.getElementById('cod'), err = document.getElementById('err');
async function sha(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function apri() { gate.remove(); sessionStorage.setItem('per-' + S, H); await import('/per-assets/js/app.js'); }
async function prova() {
  const v = inp.value.replace(/\D/g, '');
  if (v.length !== 5) { err.textContent = 'Il codice ha cinque cifre.'; return; }
  if (await sha(S + ':' + v) === H) apri(); else { err.textContent = 'Codice non corretto. Lo trova sulla lettera.'; inp.select(); }
}
document.getElementById('ok').onclick = prova;
inp.addEventListener('keydown', e => { if (e.key === 'Enter') prova(); });
if (sessionStorage.getItem('per-' + S) === H) apri();
</script>
