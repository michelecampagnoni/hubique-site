<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Viale Sabotino 22 · la casa in 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;font-family:Satoshi,system-ui,sans-serif;background:#efeae4;color:#1d1d1f;overflow:hidden}
header{position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:#7A0623;color:#fff;display:flex;justify-content:space-between;align-items:center}
.w{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1}.w small{display:block;font-family:Satoshi,sans-serif;font-size:11px;opacity:.8;letter-spacing:.06em;margin-top:3px}
.a{text-align:right;font-size:13px;line-height:1.3}.a b{display:block;font-size:15px}
model-viewer{position:absolute;inset:0;width:100%;height:100%;--poster-color:transparent;background:radial-gradient(circle at 50% 45%,#fbf9f6,#e6dfd7)}
.hint{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(29,29,31,.78);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;white-space:nowrap;transition:opacity .6s}
.btns{position:absolute;right:14px;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.btns button,#ar{font:inherit;font-size:13px;font-weight:700;padding:10px 14px;border-radius:10px;border:0;background:#fff;color:#7A0623;box-shadow:0 2px 10px rgba(0,0,0,.15);cursor:pointer}
#ar{position:absolute;left:14px;bottom:calc(70px + env(safe-area-inset-bottom));background:#B20933;color:#fff}
.load{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;opacity:.6}
</style>
</head>
<body>
<header><div class="w">Gabetti<small>MILANO · PORTA ROMANA</small></div><div class="a"><b>Viale Sabotino 22</b>quadrilocale con terrazzo · piano 3°</div></header>
<model-viewer id="mv" src="modello/sabotino_opt.glb" alt="Appartamento di Viale Sabotino 22 in 3D, arredato"
  camera-controls touch-action="none" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor"
  camera-orbit="-35deg 52deg auto" min-camera-orbit="auto 0deg auto" max-camera-orbit="auto 80deg auto"
  shadow-intensity="1" shadow-softness=".8" exposure="1.05" environment-image="neutral" interaction-prompt="none">
  <div class="load" slot="poster">Carico la casa in 3D…</div>
  <button slot="ar-button" id="ar">Mettila sul tavolo (AR)</button>
</model-viewer>
<div class="btns"><button data-o="-35deg 52deg auto">Spaccato</button><button data-o="0deg 0deg auto">Dall'alto</button><button data-o="20deg 72deg auto">Dal terrazzo</button></div>
<div class="hint" id="hint">Un dito per ruotare · due dita per ingrandire</div>
<script>
const mv = document.getElementById('mv');
document.querySelectorAll('.btns button').forEach(b => b.onclick = () => { mv.cameraOrbit = b.dataset.o; mv.fieldOfView = 'auto'; });
setTimeout(() => document.getElementById('hint').style.opacity = 0, 6000);
</script>
</body>
</html>
